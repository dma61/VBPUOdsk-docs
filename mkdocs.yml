site_name: VB-PUO Standard Documentation
site_description: Functional and technical documentation for the data exchange standard.
site_author: SIVI_r
site_url: https://stichting-sivi.github.io/VBPUOdsk-docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - navigation.instant
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Full manual (PDF)"
      add_print_site_banner: false
      add_table_of_contents: true
      toc_title: "Table of contents"
      toc_depth: 3
markdown_extensions:
  - attr_list
extra:
  version:
    provider: mike
    alias: true
nav:
  - 'Home': 'index.md'
  - 'Chapter 1: Introduction': 'chapter-1-introduction.md'
  - 'Chapter 2: Principles': 'chapter-2-principles.md'
  - 'Chapter 3: SPR Processes': 'chapter-3-spr-processes.md'
  - 'Chapter 4: FPR Processes and Feedback (applies to FPR & SPR)': 'chapter-4-fpr-processes.md'
  - 'Chapter 5: Data Standard Setup': 'chapter-5-data-standard-setup.md'
  - 'Chapter 6: Functional Specifications': 'chapter-6-functional-specs.md'
  - 'Chapter 6.4: Messages': 'chapter-6-4-messages.md'
  - 'Chapter 6.5: Cross-reference': 'chapter-6-5-cross-reference.md'
  - 'Chapter 7: Technical Specifications': 'chapter-7-tech-specs.md'
  - 'Chapter 7.4: Transport / OpenAPI': 'chapter-7-4-transport-openapi.md'
  - 'Chapter 7.5: Message Assembly': 'chapter-7-5-message-assembly.md'
  - 'Chapter 7.6: Chunking': 'chapter-7-6-chunking.md'
  - 'Chapter 8: Appendices': 'chapter-8-appendices.md'
  - 'Chapter 8.1: Glossary VB-PUO': 'chapter-8-1-glossary-vbpuo.md'
  - 'Chapter 8.2: Glossary Data Exchange': 'chapter-8-2-glossary-data-exchange.md'
  - 'Chapter 8.3: Standard Components': 'chapter-8-3-standard-components.md'
  - 'Chapter 8.4: Translation Table': 'chapter-8-4-translation-table.md'
